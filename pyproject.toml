[project]
name = "smugmug-mcp"
version = "1.0.0"
description = "Connect SmugMug to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No SmugMug API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["smugmug", "smugmug api", "smugmug mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/smugmug-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=smugmug"
Source = "https://github.com/cotlet-connect/smugmug-mcp"

[project.scripts]
smugmug-mcp = "smugmug_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"smugmug_agent.py" = "smugmug_agent.py"

[tool.hatch.build.targets.sdist]
include = ["smugmug_agent.py", "README.md", "LICENSE", "mcp.json", "skills", "examples", ".cursor"]
